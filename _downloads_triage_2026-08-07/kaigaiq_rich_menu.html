<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KaigaiQ Rich Menu - PNG保存用</title>
<style>body{margin:0;background:#333;display:flex;flex-direction:column;align-items:center;padding:20px;gap:20px}
canvas{border:1px solid #555}
button{padding:12px 32px;background:#c8a45c;color:#1a1208;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
button:hover{background:#f0d080}
p{color:#fff;font-size:14px}</style>
</head>
<body>
<p>下のボタンをクリックしてPNG画像を保存してください</p>
<canvas id="canvas" width="2500" height="843"></canvas>
<button onclick="savePNG()">PNG画像をダウンロード</button>
<script>
const svg = `<svg width="2500" height="843" viewBox="0 0 2500 843" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>
  <rect width="2500" height="843" fill="url(#bg)"/>
  <rect x="0" y="0" width="2500" height="4" fill="#f0d080"/>
  <rect x="833" y="20" width="2" height="803" fill="#c8a45c" opacity="0.3"/>
  <rect x="1667" y="20" width="2" height="803" fill="#c8a45c" opacity="0.3"/>
  <rect x="0" y="0" width="833" height="843" fill="#1a1428"/>
  <circle cx="416" cy="290" r="90" fill="none" stroke="#f0d080" stroke-width="8"/>
  <ellipse cx="416" cy="290" rx="45" ry="90" fill="none" stroke="#f0d080" stroke-width="3" opacity="0.5"/>
  <line x1="326" y1="290" x2="506" y2="290" stroke="#f0d080" stroke-width="3" opacity="0.5"/>
  <line x1="482" y1="356" x2="530" y2="404" stroke="#f0d080" stroke-width="10" stroke-linecap="round"/>
  <text x="416" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="52" fill="#f0d080">求人を見る</text>
  <text x="416" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#c8a45c">kaigaiq.com</text>
  <rect x="266" y="650" width="300" height="60" rx="30" fill="#c8a45c"/>
  <text x="416" y="688" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#1a1208">CHECK</text>
  <rect x="835" y="0" width="830" height="843" fill="#0d0d18"/>
  <rect x="1100" y="190" width="200" height="160" rx="24" fill="none" stroke="#f0d080" stroke-width="8"/>
  <polygon points="1150,350 1130,400 1200,350" fill="#f0d080"/>
  <circle cx="1160" cy="270" r="14" fill="#f0d080"/>
  <circle cx="1200" cy="270" r="14" fill="#f0d080"/>
  <circle cx="1240" cy="270" r="14" fill="#f0d080"/>
  <text x="1250" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="52" fill="#f0d080">無料相談</text>
  <text x="1250" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#c8a45c">お気軽にどうぞ</text>
  <rect x="1100" y="650" width="300" height="60" rx="30" fill="#c8a45c"/>
  <text x="1250" y="688" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#1a1208">TALK</text>
  <rect x="1669" y="0" width="831" height="843" fill="#1a1428"/>
  <rect x="1920" y="190" width="150" height="180" rx="12" fill="none" stroke="#f0d080" stroke-width="8"/>
  <line x1="1945" y1="250" x2="2045" y2="250" stroke="#f0d080" stroke-width="5"/>
  <line x1="1945" y1="290" x2="2045" y2="290" stroke="#f0d080" stroke-width="5"/>
  <line x1="1945" y1="330" x2="2000" y2="330" stroke="#f0d080" stroke-width="5"/>
  <text x="2084" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="46" fill="#f0d080">掲載申し込み</text>
  <text x="2084" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#c8a45c">店舗様はこちら</text>
  <rect x="1934" y="650" width="300" height="60" rx="30" fill="#c8a45c"/>
  <text x="2084" y="688" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#1a1208">APPLY</text>
</svg>`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();
const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
const url = URL.createObjectURL(blob);
img.onload = function() {
  ctx.drawImage(img, 0, 0, 2500, 843);
  URL.revokeObjectURL(url);
};
img.src = url;

function savePNG() {
  const link = document.createElement('a');
  link.download = 'kaigaiq_rich_menu.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
